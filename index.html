<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AXIOM | Mathematical Navigator</title>
    <link rel="icon" href="data:,"> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            startup: { ready: () => { MathJax.startup.defaultReady(); window.mjReady = true; } }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="symbol-layer" class="scholarly-bg"></div>

    <div class="app-container">
        <section id="screen-login" class="screen">
            <div class="glass-card central-auth">
                <h1 class="serif-title">AXIOM</h1>
                <p class="subtitle">Identify yourself, Scholar.</p>
                <input type="text" id="callsign-input" placeholder="ENTER ID..." maxlength="12">
                <button class="action-btn main" onclick="submitLogin()">INITIALIZE</button>
            </div>
        </section>

        <section id="screen-home" class="screen hidden">
            <header class="home-header">
                <div class="user-meta">
                    <span class="label">ID: <span id="display-name" class="val">---</span></span>
                    <div class="xp-bar"><div id="xp-fill"></div></div>
                </div>
                <div class="stat-ring">
                    <div id="best-val">0</div>
                    <small>BEST</small>
                </div>
            </header>
            
            <div class="scroll-v">
                <button id="repair-btn" class="menu-action-card repair hidden" onclick="startRepair()">
                    <strong>REPAIR GAPS</strong>
                    <small>Re-calibrate identified weaknesses</small>
                </button>
                <div class="section-label">ARCHIVES</div>
                <div id="chapter-list"></div>
            </div>
        </section>

        <section id="screen-difficulty" class="screen hidden">
            <button class="back-link" onclick="showScreen('screen-home')">← BACK</button>
            <h2 class="serif-title">Pace</h2>
            <div class="scroll-v">
                <button class="menu-action-card" onclick="setDiff(30)">Contemplative (30s)</button>
                <button class="menu-action-card" onclick="setDiff(15)">Focused (15s)</button>
                <button class="menu-action-card critical" onclick="setDiff(8)">Instant (8s)</button>
            </div>
        </section>

        <section id="screen-game" class="screen hidden">
            <div class="hud">
                <div id="lives-box">❤️❤️❤️</div>
                <div class="streak-pill">STREAK: <span id="streak-box">0</span></div>
            </div>
            <div class="timer-rail"><div id="timer-fill"></div></div>
            <div class="math-card">
                <div id="formula-display" class="math-main"></div>
            </div>
            <div id="options-stack" class="options-grid"></div>
        </section>

        <section id="screen-vault" class="screen hidden">
            <h2 class="serif-title">Vault</h2>
            <div class="scroll-v" id="vault-list"></div>
        </section>

        <section id="screen-logs" class="screen hidden">
            <h2 class="serif-title">Knowledge Gaps</h2>
            <div class="scroll-v" id="logs-list"></div>
        </section>

        <nav id="main-dock" class="bottom-dock hidden">
            <div class="nav-item active" onclick="showScreen('screen-home')">CORE</div>
            <div class="nav-item" onclick="showScreen('screen-vault')">VAULT</div>
            <div class="nav-item" onclick="showScreen('screen-logs')">GAPS</div>
        </nav>
    </div>

    <div id="roast-overlay" class="overlay hidden">
        <div class="modal-sheet">
            <p id="roast-msg" class="roast-text"></p>
            <div class="answer-reveal">
                <label>Verified Derivation:</label>
                <div id="correct-display" class="math-main"></div>
            </div>
            <button class="action-btn" onclick="closeRoast()">CONTINUE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
